<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review requested changes</title>
<style>*{box-sizing:border-box}body{background:#f3f6fa;color:#172b43;font:17px/1.55 system-ui;margin:0}main{max-width:950px;margin:30px auto;padding:20px}h1{font-size:30px}h2{font-size:23px}h3{font-size:19px}nav{display:flex;gap:10px;flex-wrap:wrap}button,input,select,textarea{font:inherit;border:1px solid #91a5b9;border-radius:6px;padding:10px;color:#172b43;background:white}button{cursor:pointer}button.active,button.primary{color:white;background:#174a74}article,.box{background:white;padding:22px;border:1px solid #cbd5e1;border-radius:10px;margin:18px 0}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%}textarea{min-height:75px}.example{background:#fff6db;padding:12px}.evidence{background:#edf4f9;padding:12px;white-space:pre-wrap}.small{font-size:14px;color:#455b71}a{color:#155b91}summary{cursor:pointer}#status{padding:15px;font-weight:600;white-space:pre-wrap}button.primary{width:100%;font-weight:700;margin-top:18px}</style>
<main><h1>What needs your review?</h1><p>Check only the questions below. Keep unknown values when evidence is missing. Examples explain how to answer—they are not prefilled judgments.</p><nav id="tabs"></nav><div id="content"></div><div id="status" role="status" aria-live="polite"></div></main>
<script>
const TOKEN='__TOKEN__';let pack,active=0,forms={},saved={};const $=x=>document.getElementById(x);const node=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let serial=0;
function control(parent,label,value,choices,change){let id='f'+(++serial),l=node('label',label),n=node(choices?'select':'textarea');l.htmlFor=id;n.id=id;if(choices)for(let [v,t]of choices){let o=node('option',t);o.value=v;n.append(o)}n.value=value||'';n.oninput=()=>change(n.value);parent.append(l,n);return n}
function link(parent,label,url){if(!url||!(url.startsWith('https://')||url.startsWith('/pdf?')))return;let a=node('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a,node('br'))}
function render(){let c=pack.cards[active];let r=forms[c.id]??={candidate_id:c.id,source_sha256:c.source_sha256,reviewer:'',coverage:'',decision:'',notes:'',fields:{}};$('tabs').replaceChildren();pack.cards.forEach((x,i)=>{let b=node('button',x.title,i===active?'active':'');b.onclick=()=>{active=i;render()};$('tabs').append(b)});$('content').replaceChildren();$('status').textContent='';let top=node('section',undefined,'box');top.append(node('h2',c.title),node('p',c.document_status));if(c.repository_url){link(top,'1. Original repository webpage (catalogue and download links)',c.repository_url);top.append(node('p','This is the original catalogue entry. The PDF below was obtained from KCAA after repository access failed.','small'));}else{top.append(node('p','This result was discovered directly as a PDF; no separate catalogue webpage is recorded.','small'));}link(top,'Official PDF on publisher website (online)',c.source_url);if(c.pdf_path)link(top,'Saved PDF used by the agent (local evidence copy)', '/pdf?id='+encodeURIComponent(c.id));top.append(node('p','The two PDF links should show the same document: one is hosted by the publisher, the other is the saved copy used for this run. Review the saved copy; use the website to check the current source.','small'));top.append(node('p',c.reading_help,'small'));if(saved[c.id]){let prev=node('details');prev.append(node('summary','Previous saved review'),node('p','Reviewer: '+saved[c.id].reviewer),node('p',saved[c.id].correction));top.append(prev)}$('content').append(top);
for(let item of c.items){let v=r.fields[item.id]??={decision:'',value:'',reference:'',quote:'',reason:''};let a=node('article');a.append(node('h3',item.question),node('p','Agent currently says: '+item.current),node('p',item.why));if(item.evidence)a.append(node('div',item.evidence,'evidence'));a.append(node('p','Where to check: '+item.where));let ex=node('details',undefined,'example');ex.append(node('summary','Example answer'),node('p',item.example));a.append(ex);control(a,'Your decision',v.decision,[['','Choose'],['keep','Keep the current interpretation'],['correct','Correct it using evidence'],['unknown','Still unknown / agent needs more evidence'],['exclude','Outside our study scope']],x=>{v.decision=x;correction.hidden=x!=='correct'});let correction=node('div');correction.hidden=v.decision!=='correct';control(correction,'Corrected value',v.value,null,x=>v.value=x);control(correction,'Evidence reference (source URL and page/section)',v.reference,null,x=>v.reference=x);control(correction,'Exact supporting passage',v.quote,null,x=>v.quote=x);a.append(correction);control(a,'Brief reason or missing evidence',v.reason,null,x=>v.reason=x);$('content').append(a)}
let end=node('section',undefined,'box');control(end,'Your name',r.reviewer,null,x=>r.reviewer=x);control(end,'What did you read?',r.coverage,[['','Choose'],['passages','Relevant passages and surrounding context'],['whole_document','The whole source document'],['additional_sources','Source plus additional documents']],x=>r.coverage=x);control(end,'Overall outcome',r.decision,[['','Choose'],['supported','Supported as written'],['corrected','Corrections recorded; further validation may be needed'],['more_evidence','Agent needs more evidence'],['exclude','Exclude this candidate']],x=>r.decision=x);control(end,'Overall note (optional)',r.notes,null,x=>r.notes=x);let button=node('button','Submit review — save to CSV','primary');button.onclick=async()=>{button.disabled=true;try{let response=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify(r)});let result=await response.json();if(!response.ok)throw Error(result.error);$('status').textContent='Saved successfully to human-labels.csv at '+result.saved_at+'\n'+result.path;saved[c.id]={reviewer:r.reviewer,correction:r.notes};}catch(e){$('status').textContent=e.message}finally{button.disabled=false}};end.append(button,node('p','Submit saves your decisions and corrections in the existing human-labels.csv. It keeps a backup, preserves other rows, and does not overwrite agent evidence or push to GitHub.','small'));$('content').append(end)}
(async()=>{try{pack=await(await fetch('/data')).json();for(let row of await(await fetch('/saved')).json())saved[row.candidate_id]=row;for(let c of pack.cards){let row=saved[c.id];if(row?.reviewed_source_sha256===c.source_sha256&&row.field_reviews_json){forms[c.id]={candidate_id:c.id,source_sha256:c.source_sha256,reviewer:row.reviewer,coverage:row.review_coverage,decision:row.review_decision,notes:row.overall_note||'',fields:JSON.parse(row.field_reviews_json)}}}render()}catch(e){$('status').textContent='Could not load the review workspace: '+e.message}})();
</script></html>
