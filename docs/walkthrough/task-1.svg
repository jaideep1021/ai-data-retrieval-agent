<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><rect width="760" height="600" fill="#f4f7fb"/><g font-family="Arial" fill="#172b4d"><text x="30" y="35" font-size="24">Autonomous search</text><rect x="50" y="60" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="92" font-size="18">1. CLI inputs</text><text x="370" y="135" font-size="22">↓</text><rect x="50" y="140" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="172" font-size="18">2. Generate and validate query</text><text x="370" y="215" font-size="22">↓</text><rect x="50" y="220" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="252" font-size="18">3. Search and select candidate</text><text x="370" y="295" font-size="22">↓</text><rect x="50" y="300" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="332" font-size="18">4. Fetch page under robots rules</text><text x="370" y="375" font-size="22">↓</text><rect x="50" y="380" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="412" font-size="18">5. Extract value and quotes</text><text x="370" y="455" font-size="22">↓</text><rect x="50" y="460" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="492" font-size="18">6. Check grounding and save result</text></g></svg>