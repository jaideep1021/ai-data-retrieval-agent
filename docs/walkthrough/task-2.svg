<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><rect width="760" height="600" fill="#f4f7fb"/><g font-family="Arial" fill="#172b4d"><text x="30" y="35" font-size="24">Multi source verification</text><rect x="50" y="60" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="92" font-size="18">1. Entity and attribute</text><text x="370" y="135" font-size="22">↓</text><rect x="50" y="140" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="172" font-size="18">2. Generate query</text><text x="370" y="215" font-size="22">↓</text><rect x="50" y="220" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="252" font-size="18">3. Search providers and deduplicate URLs</text><text x="370" y="295" font-size="22">↓</text><rect x="50" y="300" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="332" font-size="18">4. Select and fetch bounded sources</text><text x="370" y="375" font-size="22">↓</text><rect x="50" y="380" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="412" font-size="18">5. Extract and ground each claim</text><text x="370" y="455" font-size="22">↓</text><rect x="50" y="460" width="660" height="52" rx="10" fill="#dfebfa"/><text x="70" y="492" font-size="18">6. Compare values and save evidence</text></g></svg>